<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVillage - Creador de Mascotas</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --accent: #FF9800;
            --light: #f5f5f5;
            --dark: #333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .editor-panel {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            background: var(--light);
        }
        
        .preview-panel {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            background: #e9f5ff;
            display: flex;
            flex-direction: column;
        }
        
        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        button:hover {
            background: #3d8b40;
        }
        
        .canvas-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin: 15px 0;
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        #drawingCanvas {
            display: block;
            background: white;
            cursor: crosshair;
            width: 100%;
        }
        
        .tools {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .tool-btn {
            flex: 1;
            padding: 8px;
            background: var(--secondary);
        }
        
        .tool-btn.active {
            background: var(--accent);
        }
        
        .color-palette {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color.active {
            border-color: var(--dark);
            transform: scale(1.1);
        }
        
        .audio-controls {
            margin-top: 15px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        
        .audio-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .record-btn {
            background: #f44336;
        }
        
        .record-btn.recording {
            background: #d32f2f;
            animation: pulse 1.5s infinite;
        }
        
        .stop-btn {
            background: #607d8b;
        }
        
        .play-btn {
            background: var(--accent);
        }
        
        .audio-preview {
            margin-top: 10px;
            display: none;
        }
        
        .pet-preview {
            flex: 1;
            background: #c8e6c9;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }
        
        .preview-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .preview-image canvas {
            max-width: 100%;
            max-height: 100%;
        }
        
        .preview-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .preview-bio {
            text-align: center;
            max-width: 300px;
            margin-bottom: 15px;
        }
        
        .play-sound-btn {
            background: var(--accent);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .save-btn {
            background: var(--primary);
        }
        
        .reset-btn {
            background: #9e9e9e;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .color-palette {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Volver al Pueblo</a>
            <h1>PetVillage - Creador de Mascotas</h1>
            <p class="subtitle">Diseña tu mascota virtual y dale vida con tu voz</p>
        </header>
        
        <div class="app-container">
            <div class="editor-panel">
                <h2 class="panel-title">Creador de Mascotas</h2>
                
                <div class="form-group">
                    <label for="petName">Nombre de tu mascota:</label>
                    <input type="text" id="petName" placeholder="Ej: Pelusita, Firulais...">
                </div>
                
                <div class="form-group">
                    <label for="petBio">Biografía:</label>
                    <textarea id="petBio" placeholder="Cuéntanos sobre la personalidad de tu mascota..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Dibuja a tu mascota:</label>
                    <div class="tools">
                        <button class="tool-btn active" id="pencilTool">Lápiz</button>
                        <button class="tool-btn" id="eraserTool">Borrador</button>
                        <button class="tool-btn" id="clearTool">Limpiar</button>
                    </div>
                    
                    <div class="color-palette" id="colorPalette">
                        <!-- Colores generados por JavaScript -->
                    </div>
                    
                    <div class="canvas-container">
                        <canvas id="drawingCanvas" width="400" height="300"></canvas>
                    </div>
                </div>
                
                <div class="audio-controls">
                    <label>Grabar sonido de tu mascota:</label>
                    <div class="audio-buttons">
                        <button class="record-btn" id="recordBtn">🎤 Grabar</button>
                        <button class="stop-btn" id="stopBtn" disabled>⏹️ Parar</button>
                        <button class="play-btn" id="playBtn" disabled>▶️ Reproducir</button>
                    </div>
                    <audio id="audioPreview" class="audio-preview" controls></audio>
                </div>
                
                <div class="action-buttons">
                    <button class="save-btn" id="savePet">Guardar Mascota</button>
                    <button class="reset-btn" id="resetForm">Empezar de nuevo</button>
                </div>
            </div>
            
            <div class="preview-panel">
                <h2 class="panel-title">Vista Previa</h2>
                <div class="pet-preview">
                    <div class="preview-image">
                        <canvas id="previewCanvas" width="200" height="200"></canvas>
                    </div>
                    <div class="preview-name" id="previewName">Nombre de la mascota</div>
                    <div class="preview-bio" id="previewBio">Biografía aparecerá aquí...</div>
                    <button class="play-sound-btn" id="previewSoundBtn" disabled>🔊 Escuchar sonido</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>PetVillage - Un proyecto para crear y compartir mascotas virtuales</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos del DOM
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewCtx = previewCanvas.getContext('2d');
            const petNameInput = document.getElementById('petName');
            const petBioInput = document.getElementById('petBio');
            const recordBtn = document.getElementById('recordBtn');
            const stopBtn = document.getElementById('stopBtn');
            const playBtn = document.getElementById('playBtn');
            const audioPreview = document.getElementById('audioPreview');
            const savePetBtn = document.getElementById('savePet');
            const resetFormBtn = document.getElementById('resetForm');
            const previewName = document.getElementById('previewName');
            const previewBio = document.getElementById('previewBio');
            const previewSoundBtn = document.getElementById('previewSoundBtn');
            const colorPalette = document.getElementById('colorPalette');
            
            // Herramientas de dibujo
            const pencilTool = document.getElementById('pencilTool');
            const eraserTool = document.getElementById('eraserTool');
            const clearTool = document.getElementById('clearTool');
            
            // Variables de estado
            let isDrawing = false;
            let currentTool = 'pencil';
            let currentColor = '#000000';
            let lastX = 0;
            let lastY = 0;
            let currentAudio = null;
            let mediaRecorder = null;
            let audioChunks = [];
            let isRecording = false;
            
            // Generar paleta de colores
            const colors = [
                '#000000', '#434343', '#666666', '#999999', '#b7b7b7', '#cccccc', '#d9d9d9', '#efefef', 
                '#ffffff', '#980000', '#ff0000', '#ff9900', '#ffff00', '#00ff00', '#00ffff', '#4a86e8', 
                '#0000ff', '#9900ff', '#ff00ff', '#ffcccc', '#fce5cd', '#fff2cc', '#d9ead3', '#d0e0e3', 
                '#c9daf8', '#cfe2f3', '#d9d2e9', '#ead1dc', '#ea9999', '#f9cb9c', '#ffe599', '#b6d7a8', 
                '#a2c4c9', '#a4c2f4', '#9fc5e8', '#b4a7d6', '#d5a6bd', '#e06666', '#f6b26b', '#ffd966', 
                '#93c47d', '#76a5af', '#6fa8dc', '#8e7cc3', '#c27ba0', '#cc4125', '#e69138', '#f1c232', 
                '#6aa84f', '#45818e', '#3d85c6', '#674ea7', '#a64d79'
            ];
            
            // Inicializar la paleta de colores
            colors.forEach(color => {
                const colorElement = document.createElement('div');
                colorElement.className = 'color';
                colorElement.style.backgroundColor = color;
                colorElement.setAttribute('data-color', color);
                
                if (color === '#000000') {
                    colorElement.classList.add('active');
                }
                
                colorElement.addEventListener('click', function() {
                    document.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentColor = this.getAttribute('data-color');
                });
                
                colorPalette.appendChild(colorElement);
            });
            
            // Inicializar el lienzo
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Inicializar el lienzo de vista previa
            previewCtx.fillStyle = 'white';
            previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
            
            // Eventos de dibujo
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('touchstart', handleTouchStart);
            
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchmove', handleTouchMove);
            
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Configurar herramientas
            pencilTool.addEventListener('click', function() {
                setActiveTool('pencil');
            });
            
            eraserTool.addEventListener('click', function() {
                setActiveTool('eraser');
            });
            
            clearTool.addEventListener('click', function() {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                updatePreview();
            });
            
            // Actualizar vista previa cuando cambia el nombre o biografía
            petNameInput.addEventListener('input', updatePreview);
            petBioInput.addEventListener('input', updatePreview);
            
            // Grabación de audio
            recordBtn.addEventListener('click', startRecording);
            stopBtn.addEventListener('click', stopRecording);
            playBtn.addEventListener('click', playRecording);
            previewSoundBtn.addEventListener('click', playRecording);
            
            // Guardar mascota
            savePetBtn.addEventListener('click', function() {
                const name = petNameInput.value.trim();
                if (!name) {
                    alert('¡Por favor, ponle un nombre a tu mascota!');
                    return;
                }
                
                // Obtener la imagen del canvas
                const imageData = canvas.toDataURL();
                
                // Crear objeto mascota
                const pet = {
                    id: Date.now(),
                    name: name,
                    bio: petBioInput.value.trim(),
                    image: imageData,
                    sound: currentAudio,
                    created: new Date().toLocaleDateString()
                };
                
                // Guardar en localStorage
                savePetToStorage(pet);
                
                // Limpiar formulario
                resetForm();
                
                alert(`¡${name} se ha guardado correctamente! Ve al pueblo para verlo.`);
            });
            
            // Resetear formulario
            resetFormBtn.addEventListener('click', resetForm);
            
            // Funciones de dibujo
            function startDrawing(e) {
                isDrawing = true;
                const pos = getMousePos(canvas, e);
                [lastX, lastY] = [pos.x, pos.y];
            }
            
            function draw(e) {
                if (!isDrawing) return;
                
                const pos = getMousePos(canvas, e);
                const currentX = pos.x;
                const currentY = pos.y;
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(currentX, currentY);
                
                if (currentTool === 'pencil') {
                    ctx.strokeStyle = currentColor;
                } else if (currentTool === 'eraser') {
                    ctx.strokeStyle = 'white';
                }
                
                ctx.stroke();
                
                [lastX, lastY] = [currentX, currentY];
                
                // Actualizar vista previa
                updatePreview();
            }
            
            function stopDrawing() {
                isDrawing = false;
            }
            
            function handleTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
            
            function handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
            
            function getMousePos(canvas, evt) {
                const rect = canvas.getBoundingClientRect();
                let clientX, clientY;
                
                if (evt.type.includes('touch')) {
                    clientX = evt.touches[0].clientX;
                    clientY = evt.touches[0].clientY;
                } else {
                    clientX = evt.clientX;
                    clientY = evt.clientY;
                }
                
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }
            
            function setActiveTool(tool) {
                currentTool = tool;
                
                // Actualizar botones activos
                pencilTool.classList.toggle('active', tool === 'pencil');
                eraserTool.classList.toggle('active', tool === 'eraser');
            }
            
            function updatePreview() {
                // Actualizar nombre y biografía
                previewName.textContent = petNameInput.value || 'Nombre de la mascota';
                previewBio.textContent = petBioInput.value || 'Biografía aparecerá aquí...';
                
                // Actualizar imagen
                previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                const img = new Image();
                img.onload = function() {
                    previewCtx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);
                };
                img.src = canvas.toDataURL();
            }
            
            // Funciones de grabación de audio
            async function startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        currentAudio = URL.createObjectURL(audioBlob);
                        audioPreview.src = currentAudio;
                        audioPreview.style.display = 'block';
                        playBtn.disabled = false;
                        previewSoundBtn.disabled = false;
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.disabled = true;
                    recordBtn.classList.add('recording');
                    stopBtn.disabled = false;
                    
                } catch (error) {
                    console.error('Error al acceder al micrófono:', error);
                    alert('No se pudo acceder al micrófono. Asegúrate de permitir el acceso.');
                }
            }
            
            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordBtn.disabled = false;
                    recordBtn.classList.remove('recording');
                    stopBtn.disabled = true;
                    
                    // Detener todas las pistas de audio
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
            
            function playRecording() {
                if (currentAudio) {
                    const audio = new Audio(currentAudio);
                    audio.play();
                }
            }
            
            // Funciones para gestionar mascotas
            function savePetToStorage(pet) {
                let pets = JSON.parse(localStorage.getItem('petVillage')) || [];
                pets.push(pet);
                localStorage.setItem('petVillage', JSON.stringify(pets));
            }
            
            function resetForm() {
                petNameInput.value = '';
                petBioInput.value = '';
                
                // Limpiar canvas
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Limpiar audio
                currentAudio = null;
                audioPreview.style.display = 'none';
                audioPreview.src = '';
                playBtn.disabled = true;
                previewSoundBtn.disabled = true;
                
                // Actualizar vista previa
                updatePreview();
            }
        });
    </script>
</body>
</html>
