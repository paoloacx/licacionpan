<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor de Mascotas</title>
<style>
  body{margin:0;font-family:sans-serif;background:#222;color:#eee}
  header{padding:10px;background:#333;display:flex;gap:10px;align-items:center}
  input[type=text]{padding:6px;border-radius:6px;border:none}
  .btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;background:#7c5cff;color:white}
  main{display:flex;gap:20px;padding:20px}
  .panel{width:200px}
  canvas{border:1px solid #555;border-radius:8px;display:block}
  .sticker{cursor:pointer;font-size:24px;margin:4px}
</style>
</head>
<body>
<header>
  <label>Nombre: <input id="petName" type="text" placeholder="Mi mascota"></label>
  <button class="btn" id="saveBtn">Guardar mascota</button>
  <button class="btn" onclick="window.location.href='index.html'">🏡 Volver</button>
</header>
<main>
  <div class="panel">
    <h3>Stickers</h3>
    <div id="stickers">
      <span class="sticker">👀</span>
      <span class="sticker">😊</span>
      <span class="sticker">😎</span>
      <span class="sticker">🐾</span>
      <span class="sticker">🎩</span>
      <span class="sticker">🦴</span>
    </div>
  </div>
  <div style="flex:1;position:relative">
    <canvas id="drawCanvas" width="800" height="500"></canvas>
    <canvas id="stickerCanvas" width="800" height="500" style="position:absolute;left:0;top:0"></canvas>
  </div>
</main>

<script>
const petName=document.getElementById('petName');
const drawCanvas=document.getElementById('drawCanvas');
const stickerCanvas=document.getElementById('stickerCanvas');
const dctx=drawCanvas.getContext('2d');
const sctx=stickerCanvas.getContext('2d');
let drawing=false,last=null;
let stickers=[];let selected=-1;

// Dibujo
drawCanvas.addEventListener('mousedown',e=>{drawing=true;last=pos(e)});
drawCanvas.addEventListener('mousemove',e=>{
  if(!drawing)return;
  const p=pos(e);
  dctx.strokeStyle="#fff";dctx.lineWidth=4;dctx.lineCap="round";
  dctx.beginPath();dctx.moveTo(last.x,last.y);dctx.lineTo(p.x,p.y);dctx.stroke();
  last=p;
});
window.addEventListener('mouseup',()=>drawing=false);
drawCanvas.addEventListener('touchstart',e=>{drawing=true;last=pos(e);e.preventDefault()},{passive:false});
drawCanvas.addEventListener('touchmove',e=>{
  if(!drawing)return;
  const p=pos(e);
  dctx.strokeStyle="#fff";dctx.lineWidth=4;dctx.lineCap="round";
  dctx.beginPath();dctx.moveTo(last.x,last.y);dctx.lineTo(p.x,p.y);dctx.stroke();
  last=p;e.preventDefault();
},{passive:false});
window.addEventListener('touchend',()=>drawing=false);

function pos(e){
  const r=drawCanvas.getBoundingClientRect();
  if(e.touches){return {x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}}
  return {x:e.clientX-r.left,y:e.clientY-r.top}
}

// Stickers
document.getElementById('stickers').addEventListener('click',e=>{
  if(e.target.classList.contains('sticker')){
    stickers.push({emoji:e.target.textContent,x:400,y:250,size:40});
    renderStickers();
  }
});
function renderStickers(){
  sctx.clearRect(0,0,stickerCanvas.width,stickerCanvas.height);
  stickers.forEach((s,i)=>{
    sctx.font=s.size+"px serif";
    sctx.textAlign="center";sctx.textBaseline="middle";
    sctx.fillText(s.emoji,s.x,s.y);
    if(i===selected){
      sctx.strokeStyle="cyan";sctx.strokeRect(s.x-s.size/2,s.y-s.size/2,s.size,s.size);
    }
  });
}
stickerCanvas.addEventListener('mousedown',e=>{
  const p=pos(e);
  selected=stickers.findIndex(s=>p.x>=s.x-s.size/2&&p.x<=s.x+s.size/2&&p.y>=s.y-s.size/2&&p.y<=s.y+s.size/2);
  renderStickers();
});
stickerCanvas.addEventListener('mousemove',e=>{
  if(selected>=0&&e.buttons){
    const p=pos(e);
    stickers[selected].x=p.x;stickers[selected].y=p.y;
    renderStickers();
  }
});

// Guardar mascota
document.getElementById('saveBtn').addEventListener('click',()=>{
  const temp=document.createElement('canvas');
  temp.width=drawCanvas.width;temp.height=drawCanvas.height;
  const tctx=temp.getContext('2d');
  tctx.drawImage(drawCanvas,0,0);
  tctx.drawImage(stickerCanvas,0,0);
  tctx.fillStyle="#fff";tctx.font="20px sans-serif";
  tctx.fillText(petName.value||"Sin nombre",20,30);
  const png=temp.toDataURL("image/png");
  const todas=JSON.parse(localStorage.getItem('todasLasMascotas')||'[]');
  const idx=localStorage.getItem('mascotaActual');
  if(idx!==null){
    todas[idx]={nombre:petName.value||"Sin nombre",png};
    localStorage.removeItem('mascotaActual');
  }else{
    todas.push({nombre:petName.value||"Sin nombre",png});
  }
  localStorage.setItem('todasLasMascotas',JSON.stringify(todas));
