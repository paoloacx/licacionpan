<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVillage - Pueblo de Mascotas</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --accent: #FF9800;
            --light: #f5f5f5;
            --dark: #333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .create-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: var(--accent);
            padding: 12px 25px;
            border-radius: 30px;
            margin-bottom: 20px;
            transition: transform 0.3s, background 0.3s;
            font-weight: bold;
            box-shadow: var(--shadow);
        }
        
        .create-link:hover {
            transform: translateY(-3px);
            background: #e68900;
        }
        
        .village-container {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            min-height: 600px;
            overflow: hidden;
        }
        
        .village-scene {
            position: relative;
            min-height: 500px;
            background: #87CEEB;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        /* Elementos decorativos del pueblo */
        .house {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #FF6B6B;
            border-radius: 10px 10px 0 0;
        }
        
        .house:before {
            content: '';
            position: absolute;
            top: -30px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 30px solid #CC5555;
        }
        
        .house-1 {
            top: 50px;
            left: 80px;
        }
        
        .house-2 {
            top: 70px;
            right: 100px;
            background: #4ECDC4;
        }
        
        .house-2:before {
            border-bottom: 30px solid #3AAFA9;
        }
        
        .tree {
            position: absolute;
            width: 80px;
            height: 120px;
        }
        
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 35px;
            width: 10px;
            height: 40px;
            background: #8B4513;
        }
        
        .tree-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            background: #2E8B57;
            border-radius: 50%;
        }
        
        .tree-1 {
            top: 60px;
            left: 250px;
        }
        
        .tree-2 {
            top: 80px;
            right: 250px;
        }
        
        .fountain {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: #B0C4DE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 0 0 10px #87CEEB;
        }
        
        .fountain:before {
            content: '⛲';
        }
        
        .path {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #DEB887;
        }
        
        .path:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 20px,
                rgba(0, 0, 0, 0.1) 20px,
                rgba(0, 0, 0, 0.1) 40px
            );
        }
        
        .pets-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .pet-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
            position: relative;
            z-index: 10;
        }
        
        .pet-card:hover {
            transform: translateY(-10px) scale(1.03);
        }
        
        .pet-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.2rem;
            color: var(--primary);
        }
        
        .pet-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid var(--accent);
        }
        
        .pet-image img {
            max-width: 100%;
            max-height: 100%;
        }
        
        .pet-bio {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #666;
            min-height: 40px;
        }
        
        .pet-date {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 10px;
        }
        
        .pet-actions {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        
        .pet-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }
        
        .sound-btn {
            background: var(--accent);
            color: white;
        }
        
        .edit-btn {
            background: var(--secondary);
            color: white;
        }
        
        .delete-btn {
            background: #f44336;
            color: white;
        }
        
        .empty-village {
            text-align: center;
            color: #777;
            padding: 50px;
            grid-column: 1 / -1;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .pets-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .house, .tree {
                transform: scale(0.8);
            }
            
            .house-1 {
                left: 20px;
            }
            
            .house-2 {
                right: 20px;
            }
            
            .tree-1 {
                left: 150px;
            }
            
            .tree-2 {
                right: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PetVillage</h1>
            <p class="subtitle">Bienvenido al pueblo donde viven todas nuestras mascotas virtuales</p>
            <a href="editor.html" class="create-link">+ Crear Nueva Mascota</a>
        </header>
        
        <div class="village-container">
            <div class="village-scene">
                <!-- Casas -->
                <div class="house house-1"></div>
                <div class="house house-2"></div>
                
                <!-- Árboles -->
                <div class="tree tree-1">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                <div class="tree tree-2">
                    <div class="tree-trunk"></div>
                    <div class="tree-top"></div>
                </div>
                
                <!-- Fuente -->
                <div class="fountain"></div>
                
                <!-- Camino -->
                <div class="path"></div>
            </div>
            
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--primary);">Nuestras Mascotas</h2>
            
            <div class="pets-container" id="petsContainer">
                <div class="empty-village">
                    <p>¡Aún no hay mascotas en el pueblo!</p>
                    <p>Sé el primero en <a href="editor.html">crear una mascota</a>.</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>PetVillage - Un proyecto para crear y compartir mascotas virtuales</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const petsContainer = document.getElementById('petsContainer');
            
            // Cargar mascotas existentes
            loadPetsFromStorage();
            
            function loadPetsFromStorage() {
                const pets = JSON.parse(localStorage.getItem('petVillage')) || [];
                
                // Eliminar mensaje de pueblo vacío si hay mascotas
                if (pets.length > 0) {
                    const emptyMessage = petsContainer.querySelector('.empty-village');
                    if (emptyMessage) {
                        emptyMessage.remove();
                    }
                }
                
                // Añadir cada mascota al pueblo
                pets.forEach(pet => addPetToVillage(pet));
            }
            
            function addPetToVillage(pet) {
                const petCard = document.createElement('div');
                petCard.className = 'pet-card';
                petCard.innerHTML = `
                    <div class="pet-name">${pet.name}</div>
                    <div class="pet-image">
                        <img src="${pet.image}" alt="${pet.name}">
                    </div>
                    <div class="pet-bio">${pet.bio || 'Sin biografía'}</div>
                    <div class="pet-date">Creado: ${pet.created}</div>
                    <div class="pet-actions">
                        ${pet.sound ? '<button class="pet-btn sound-btn" data-sound="${pet.sound}">🔊</button>' : ''}
                        <button class="pet-btn edit-btn" data-id="${pet.id}">✏️</button>
                        <button class="pet-btn delete-btn" data-id="${pet.id}">🗑️</button>
                    </div>
                `;
                
                petsContainer.appendChild(petCard);
                
                // Añadir evento para reproducir sonido
                if (pet.sound) {
                    const soundButton = petCard.querySelector('.sound-btn');
                    soundButton.addEventListener('click', function() {
                        const audio = new Audio(pet.sound);
                        audio.play();
                    });
                }
                
                // Añadir evento para editar mascota
                const editButton = petCard.querySelector('.edit-btn');
                editButton.addEventListener('click', function() {
                    if (confirm(`¿Quieres editar a ${pet.name}?`)) {
                        // En una aplicación real, redirigiríamos al editor con los datos de la mascota
                        // Por simplicidad, aquí solo mostramos un mensaje
                        alert('Funcionalidad de edición en desarrollo. Por ahora, crea una nueva mascota.');
                    }
                });
                
                // Añadir evento para eliminar mascota
                const deleteButton = petCard.querySelector('.delete-btn');
                deleteButton.addEventListener('click', function() {
                    if (confirm(`¿Estás seguro de que quieres eliminar a ${pet.name} del pueblo?`)) {
                        deletePetFromStorage(pet.id);
                        petCard.remove();
                        
                        // Si no quedan mascotas, mostrar mensaje
                        if (petsContainer.children.length === 0) {
                            petsContainer.innerHTML = `
                                <div class="empty-village">
                                    <p>¡Aún no hay mascotas en el pueblo!</p>
                                    <p>Sé el primero en <a href="editor.html">crear una mascota</a>.</p>
                                </div>
                            `;
                        }
                    }
                });
            }
            
            function deletePetFromStorage(petId) {
                let pets = JSON.parse(localStorage.getItem('petVillage')) || [];
                pets = pets.filter(pet => pet.id !== petId);
                localStorage.setItem('petVillage', JSON.stringify(pets));
            }
        });
    </script>
</body>
</html>
