<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Aldea de Mascotas</title>
<style>
  body{background:#eef; font-family:sans-serif; padding:20px}
  h1{text-align:center}
  .aldea{display:flex; flex-wrap:wrap; gap:20px; justify-content:center}
  .casa{
    width:180px; border:2px solid #444; border-radius:10px;
    background:white; padding:10px; text-align:center;
    box-shadow:0 4px 6px rgba(0,0,0,0.2);
  }
  .casa img{max-width:100%; border-radius:8px}
  .casa h3{margin:8px 0 4px}
  .btn{padding:6px 10px; border:none; border-radius:6px; cursor:pointer; background:#7c5cff; color:white}
</style>
</head>
<body>
  <h1>🏡 Mis Mascotas</h1>
  <div class="aldea" id="aldea"></div>
  <div style="text-align:center;margin-top:20px">
    <button class="btn" onclick="nueva()">➕ Crear nueva mascota</button>
  </div>

  <script>
    const aldea = document.getElementById('aldea');
    const mascotas = JSON.parse(localStorage.getItem('todasLasMascotas')||'[]');
    mascotas.forEach((m,i)=>{
      const div = document.createElement('div');
      div.className='casa';
      div.innerHTML = `
        <img src="${m.png}" alt="Mascota ${m.nombre}">
        <h3>${m.nombre}</h3>
        <button class="btn" onclick="editar(${i})">Editar</button>
      `;
      aldea.appendChild(div);
    });
    function editar(i){
      localStorage.setItem('mascotaActual', i);
      window.location.href='editor.html';
    }
    function nueva(){
      localStorage.removeItem('mascotaActual');
      window.location.href='editor.html';
    }
  </script>
</body>
</html>
